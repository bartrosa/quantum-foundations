[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quantum-foundations"
version = "0.1.0"
description = "Exact computational verification helpers for quantum-foundations papers"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Bartłomiej Rosa" }]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "notebook>=7.0",
    "ipykernel>=6.29",
]

[project.scripts]
qf-verify-probe = "quantum_foundations.cli:main_verify_probe"
qf-verify-edge-fano = "quantum_foundations.cli:main_verify_edge_fano"

[tool.hatch.build.targets.wheel]
packages = ["src/quantum_foundations"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["quantum_foundations"]
